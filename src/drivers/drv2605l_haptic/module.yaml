module_name: Haptic Driver

parameters:
  - group: Haptic
    definitions:

      HAP_YAW_MAX:
        description:
          short: Maximum Yaw angle
        type: float
        unit: deg
        min: 0.0
        max: 360.0
        increment: 1.0
        default: 225.0

      HAP_YAW_MIN:
        description:
          short: Minimum Yaw angle
        type: float
        unit: deg
        min: 0.0
        max: 360.0
        increment: 1.0
        default: 135.0

      HAP_ACT_INT:
        description:
          short: Active Intensity, how loud sound is
        type: float
        min: 0.0
        max: 100.00
        increment: 1.0
        default: 70.0

      HAP_ELEV_MAX:
        description:
          short: Maximum elevation angle
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: 45.0

      HAP_ELEV_MIN:
        description:
          short: Minimum elevation angle
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: -45.0

      HAP_PITCH_MIN:
        description:
          short: Minimum pitch angle
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: -5.0

      HAP_PITCH_MAX:
        description:
          short: Maximum pitch angle
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: 5.0

      HAP_Q_FACTOR:
        description:
          short: Q-factor, diffusion/concentration of sound
        type: float
        min: 0.0
        max: 100.00
        increment: 1.0
        default: 70.0

      HAP_DRV_EFFECT_T:
        description:
          short: top haptic waveform effect (1-123)
        type: int32
        min: 1
        max: 123
        increment: 1
        default: 1

      HAP_DRV_EFFECT_B:
        description:
          short: bottom haptic waveform effect (1-123)
        type: int32
        min: 1
        max: 123
        increment: 1
        default: 1

      HAP_MULTIPLEX:
        description:
          short: using multiplexer?
        type: boolean
        default: true
