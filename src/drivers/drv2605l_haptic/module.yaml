module_name: Haptic Driver

parameters:
  - group: Haptic
    definitions:

      HAP_MULTIPLEX:
        description:
          short: using multiplexer?
        type: boolean
        default: true

      HAP_MODE:
        description:
          short: "Haptic Mode: IMU or AVS"
          long: "IMU: yaw, pitch, roll. AVS: azimuth, elevation"
        type: enum
        values:
            0: IMU
            1: AVS
        default: 0

      HAP_OFFSET:
        description:
          short: Offset angle
        type: float
        unit: deg
        min: 0
        max: 360.0
        increment: 1.0
        default: 0.0

      HAP_SENSE:
        description:
          short: Sense
        type: enum
        values:
            -1: Negative
            1: Positive
        default: 1

      HAP_YAW_MAX:
        description:
          short: Maximum Yaw angle (IMU)
        type: float
        unit: deg
        min: 0.0
        max: 360.0
        increment: 1.0
        default: 225.0

      HAP_YAW_MIN:
        description:
          short: Minimum Yaw angle (IMU)
        type: float
        unit: deg
        min: 0.0
        max: 360.0
        increment: 1.0
        default: 135.0

      HAP_ACT_INT:
        description:
          short: Active Intensity, how loud sound is
        type: float
        min: 0.0
        max: 100.00
        increment: 1.0
        default: 70.0

      HAP_ELEV_MAX:
        description:
          short: Maximum elevation angle (AVS)
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: 45.0

      HAP_ELEV_MIN:
        description:
          short: Minimum elevation angle (AVS)
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: -45.0

      HAP_PITCH_MIN:
        description:
          short: Minimum pitch angle (IMU)
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: -5.0

      HAP_PITCH_MAX:
        description:
          short: Maximum pitch angle (IMU)
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: 5.0

      HAP_ROLL_MIN:
        description:
          short: Minimum roll angle about x-axis (IMU)
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: -5.0

      HAP_ROLL_MAX:
        description:
          short: Maximum roll angle about x-axis (IMU)
        type: float
        min: -90.0
        max: 90.0
        increment: 1.0
        default: 20

      HAP_AZIMUTH_MIN:
        description:
          short: Minimum azimuth angle (AVS)
        type: float
        min: 0.0
        max: 360.0
        increment: 1.0
        default: 135.0

      HAP_AZIMUTH_MAX:
        description:
          short: Maximum azimuth angle (AVS)
        type: float
        min: 0.0
        max: 360.0
        increment: 1.0
        default: 225.0

      HAP_Q_FACTOR:
        description:
          short: Q-factor, diffusion/concentration of sound
        type: float
        min: 0.0
        max: 100.00
        increment: 1.0
        default: 70.0

      HAP_DRV_EFFECT_T:
        description:
          short: top haptic waveform effect (1-123)
        type: int32
        min: 1
        max: 123
        increment: 1
        default: 1

      HAP_DRV_EFFECT_B:
        description:
          short: bottom haptic waveform effect (1-123)
        type: int32
        min: 1
        max: 123
        increment: 1
        default: 1
